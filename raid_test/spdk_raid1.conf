# SPDK RAID1 配置文件 
# 用于测试libxpdk与SPDK RAID1的集成

[Subsystem]

[Aio]
  # 使用两个500MB的文件作为RAID1的后端存储
  AIO /home/libxpdk/raid_test/disk1.img Aio0 4096
  AIO /home/libxpdk/raid_test/disk2.img Aio1 4096

[Raid]
  # 配置RAID1设备
  Name Raid1
  StripSize 64
  NumDevices 2
  RaidLevel 1
  Devices Aio0 Aio1

